#
# Implements a reverse proxy/gateway for BroMan on Apache XAMPP
# Required modules: mod_proxy, mod_proxy_http, mod_proxy_wstunnel
#

<IfModule proxy_module>
<IfModule proxy_http_module>

#
# Reverse Proxy configuration for BroMan
#
ProxyRequests Off
ProxyPreserveHost On

<Proxy *>
    Require all granted
</Proxy>

# WebSocket proxy for Next.js / Turbopack HMR
<IfModule proxy_wstunnel_module>
    ProxyPass /broman/_next/webpack-hmr ws://127.0.0.1:3000/broman/_next/webpack-hmr
    ProxyPassReverse /broman/_next/webpack-hmr ws://127.0.0.1:3000/broman/_next/webpack-hmr
    ProxyPass /broman/_next/hmr ws://127.0.0.1:3000/broman/_next/hmr
    ProxyPassReverse /broman/_next/hmr ws://127.0.0.1:3000/broman/_next/hmr
    ProxyPass /_next/webpack-hmr ws://127.0.0.1:3000/broman/_next/webpack-hmr
    ProxyPassReverse /_next/webpack-hmr ws://127.0.0.1:3000/broman/_next/webpack-hmr
    ProxyPass /_next/hmr ws://127.0.0.1:3000/broman/_next/hmr
    ProxyPassReverse /_next/hmr ws://127.0.0.1:3000/broman/_next/hmr
</IfModule>

# BroMan Next.js App Reverse Proxy (with retry=1 and keepalive on primary worker)
ProxyPass /broman/ http://127.0.0.1:3000/broman/ retry=1 acquire=3000 timeout=600 keepalive=On
ProxyPassReverse /broman/ http://127.0.0.1:3000/broman/

ProxyPass /broman http://127.0.0.1:3000/broman
ProxyPassReverse /broman http://127.0.0.1:3000/broman

# Proxy static chunks, fonts, and dev tools that may query root paths
ProxyPass /_next/ http://127.0.0.1:3000/broman/_next/
ProxyPassReverse /_next/ http://127.0.0.1:3000/broman/_next/

ProxyPass /__nextjs_font/ http://127.0.0.1:3000/broman/__nextjs_font/
ProxyPassReverse /__nextjs_font/ http://127.0.0.1:3000/broman/__nextjs_font/

# Fallback jika server Next.js sedang proses booting / standby
ErrorDocument 503 /broman-offline.php
ErrorDocument 502 /broman-offline.php

</IfModule>
</IfModule>
